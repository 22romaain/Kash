<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floww — Budget personnel</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f8f9fb;
      --surface: #ffffff;
      --border: #e8eaef;
      --text: #1a1d26;
      --text-muted: #6b7280;
      --accent: #4f6ef7;
      --accent-light: #eef1fe;
      --accent-hover: #3d5ce5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
    }

    .logo h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo span {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 400;
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
      box-shadow: var(--shadow);
    }

    .month-nav button {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.1rem;
      transition: background .15s, color .15s;
    }

    .month-nav button:hover {
      background: var(--accent-light);
      color: var(--accent);
    }

    .month-nav .current-month {
      padding: 0 16px;
      font-weight: 600;
      font-size: 0.95rem;
      min-width: 160px;
      text-align: center;
    }

    /* Summary cards */
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .card-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .card-value {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card-value.positive { color: var(--success); }
    .card-value.negative { color: var(--danger); }
    .card-value.neutral { color: var(--accent); }

    .card-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
      width: fit-content;
    }

    .tab {
      padding: 10px 20px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: all .15s;
    }

    .tab:hover { color: var(--text); }
    .tab.active {
      background: var(--accent);
      color: white;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Grid layout */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    /* Forms */
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    textarea { resize: vertical; min-height: 72px; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      width: 100%;
      margin-top: 4px;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .btn-ghost:hover { color: var(--danger); }

    /* Budget bars */
    .budget-list { display: flex; flex-direction: column; gap: 16px; }

    .budget-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .budget-cat {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .cat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .budget-amounts {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .budget-amounts strong {
      color: var(--text);
    }

    .progress-track {
      height: 8px;
      background: var(--bg);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      transition: width .4s ease;
    }

    .progress-fill.ok { background: var(--success); }
    .progress-fill.warn { background: var(--warning); }
    .progress-fill.over { background: var(--danger); }

    /* Budget form */
    .budget-form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .budget-input-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    /* Expense list */
    .expense-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 480px;
      overflow-y: auto;
    }

    .expense-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      gap: 12px;
    }

    .expense-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .expense-info { min-width: 0; }

    .expense-desc {
      font-weight: 500;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .expense-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .expense-amount {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Charts */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .charts-grid { grid-template-columns: 1fr; }
    }

    .chart-container {
      position: relative;
      height: 260px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text);
      color: white;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      transition: all .3s;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <div class="logo-icon">F</div>
        <div>
          <h1>Floww</h1>
          <span>Budget personnel</span>
        </div>
      </div>
      <div class="month-nav">
        <button id="prevMonth" aria-label="Mois précédent">‹</button>
        <div class="current-month" id="currentMonth"></div>
        <button id="nextMonth" aria-label="Mois suivant">›</button>
      </div>
    </header>

    <div class="summary" id="summary"></div>

    <div class="tabs">
      <button class="tab active" data-tab="dashboard">Tableau de bord</button>
      <button class="tab" data-tab="expenses">Dépenses</button>
      <button class="tab" data-tab="budget">Budget</button>
    </div>

    <!-- Dashboard -->
    <div class="panel active" id="panel-dashboard">
      <div class="card">
        <div class="section-title">Dépensé vs prévu par catégorie</div>
        <div class="budget-list" id="budgetBars"></div>
      </div>
      <div class="charts-grid">
        <div class="card">
          <div class="section-title">Répartition des dépenses</div>
          <div class="chart-container"><canvas id="pieChart"></canvas></div>
        </div>
        <div class="card">
          <div class="section-title">Prévu vs dépensé</div>
          <div class="chart-container"><canvas id="barChart"></canvas></div>
        </div>
      </div>
    </div>

    <!-- Expenses -->
    <div class="panel" id="panel-expenses">
      <div class="grid-2">
        <div class="card">
          <div class="section-title">Nouvelle dépense</div>
          <form id="expenseForm">
            <div class="form-row">
              <div class="form-group">
                <label for="amount">Montant (€)</label>
                <input type="number" id="amount" step="0.01" min="0.01" required placeholder="0,00">
              </div>
              <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required>
              </div>
            </div>
            <div class="form-group">
              <label for="category">Catégorie</label>
              <select id="category" required></select>
            </div>
            <div class="form-group">
              <label for="description">Description</label>
              <textarea id="description" placeholder="Ex : Courses au supermarché" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Ajouter la dépense</button>
          </form>
        </div>
        <div class="card">
          <div class="section-title">Dépenses du mois</div>
          <div class="expense-list" id="expenseList"></div>
        </div>
      </div>
    </div>

    <!-- Budget -->
    <div class="panel" id="panel-budget">
      <div class="card">
        <div class="section-title">Budget prévisionnel — <span id="budgetMonthLabel"></span></div>
        <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:20px;">
          Définissez votre budget mensuel par catégorie pour suivre vos dépenses.
        </p>
        <div class="budget-form-grid" id="budgetForm"></div>
        <button class="btn btn-primary" id="saveBudget" style="width:auto;padding:10px 28px;">Enregistrer le budget</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const CATEGORIES = [
      { id: 'alimentation', label: 'Alimentation', color: '#4f6ef7' },
      { id: 'logement', label: 'Logement', color: '#7c3aed' },
      { id: 'transport', label: 'Transport', color: '#06b6d4' },
      { id: 'sante', label: 'Santé', color: '#10b981' },
      { id: 'loisirs', label: 'Loisirs', color: '#f59e0b' },
      { id: 'shopping', label: 'Shopping', color: '#ec4899' },
      { id: 'abonnements', label: 'Abonnements', color: '#8b5cf6' },
      { id: 'autre', label: 'Autre', color: '#6b7280' },
    ];

    const STORAGE_KEY = 'floww_data';

    let state = loadState();
    let currentDate = new Date();
    let pieChart = null;
    let barChart = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return { expenses: [], budgets: {} };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function monthKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
    }

    function formatMonth(date) {
      return date.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    }

    function formatCurrency(n) {
      return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(n);
    }

    function formatDate(d) {
      return new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    }

    function getCat(id) {
      return CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length - 1];
    }

    function getMonthExpenses() {
      const key = monthKey(currentDate);
      return state.expenses.filter(e => e.date.startsWith(key));
    }

    function getMonthBudget() {
      return state.budgets[monthKey(currentDate)] || {};
    }

    function spentByCategory() {
      const map = {};
      CATEGORIES.forEach(c => map[c.id] = 0);
      getMonthExpenses().forEach(e => {
        map[e.category] = (map[e.category] || 0) + e.amount;
      });
      return map;
    }

    function totalBudget() {
      const b = getMonthBudget();
      return Object.values(b).reduce((s, v) => s + (v || 0), 0);
    }

    function totalSpent() {
      return getMonthExpenses().reduce((s, e) => s + e.amount, 0);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // --- Render ---

    function renderSummary() {
      const spent = totalSpent();
      const budget = totalBudget();
      const remaining = budget - spent;
      const pct = budget > 0 ? Math.round((spent / budget) * 100) : 0;

      document.getElementById('summary').innerHTML = `
        <div class="card">
          <div class="card-label">Dépensé</div>
          <div class="card-value neutral">${formatCurrency(spent)}</div>
          <div class="card-sub">${getMonthExpenses().length} transaction${getMonthExpenses().length !== 1 ? 's' : ''}</div>
        </div>
        <div class="card">
          <div class="card-label">Budget prévu</div>
          <div class="card-value">${formatCurrency(budget)}</div>
          <div class="card-sub">${budget > 0 ? pct + '% utilisé' : 'Non défini'}</div>
        </div>
        <div class="card">
          <div class="card-label">Restant</div>
          <div class="card-value ${remaining >= 0 ? 'positive' : 'negative'}">${formatCurrency(remaining)}</div>
          <div class="card-sub">${remaining >= 0 ? 'Sous le budget' : 'Dépassement'}</div>
        </div>
      `;
    }

    function renderBudgetBars() {
      const spent = spentByCategory();
      const budget = getMonthBudget();
      const el = document.getElementById('budgetBars');

      const items = CATEGORIES.filter(c => (budget[c.id] || 0) > 0 || (spent[c.id] || 0) > 0);

      if (items.length === 0) {
        el.innerHTML = '<div class="empty-state">Définissez votre budget et ajoutez des dépenses pour voir la comparaison.</div>';
        return;
      }

      el.innerHTML = items.map(c => {
        const s = spent[c.id] || 0;
        const b = budget[c.id] || 0;
        const pct = b > 0 ? Math.min((s / b) * 100, 100) : (s > 0 ? 100 : 0);
        const cls = b === 0 ? 'warn' : s / b > 1 ? 'over' : s / b > 0.8 ? 'warn' : 'ok';
        return `
          <div>
            <div class="budget-item-header">
              <div class="budget-cat">
                <span class="cat-dot" style="background:${c.color}"></span>
                ${c.label}
              </div>
              <div class="budget-amounts">
                <strong>${formatCurrency(s)}</strong> / ${formatCurrency(b)}
              </div>
            </div>
            <div class="progress-track">
              <div class="progress-fill ${cls}" style="width:${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderExpenseList() {
      const expenses = getMonthExpenses().sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
      const el = document.getElementById('expenseList');

      if (expenses.length === 0) {
        el.innerHTML = '<div class="empty-state">Aucune dépense ce mois-ci.</div>';
        return;
      }

      el.innerHTML = expenses.map(e => {
        const cat = getCat(e.category);
        return `
          <div class="expense-item">
            <div class="expense-left">
              <span class="cat-dot" style="background:${cat.color}"></span>
              <div class="expense-info">
                <div class="expense-desc">${escapeHtml(e.description)}</div>
                <div class="expense-meta">${cat.label} · ${formatDate(e.date)}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="expense-amount">${formatCurrency(e.amount)}</span>
              <button class="btn btn-ghost" onclick="deleteExpense('${e.id}')" title="Supprimer">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderBudgetForm() {
      const budget = getMonthBudget();
      document.getElementById('budgetMonthLabel').textContent = formatMonth(currentDate);
      document.getElementById('budgetForm').innerHTML = CATEGORIES.map(c => `
        <div class="budget-input-group">
          <label>
            <span class="cat-dot" style="background:${c.color}"></span>
            ${c.label}
          </label>
          <input type="number" data-cat="${c.id}" step="0.01" min="0" placeholder="0,00"
            value="${budget[c.id] || ''}">
        </div>
      `).join('');
    }

    function renderCharts() {
      const spent = spentByCategory();
      const budget = getMonthBudget();
      const activeCats = CATEGORIES.filter(c => (spent[c.id] || 0) > 0 || (budget[c.id] || 0) > 0);

      if (activeCats.length === 0) {
        if (pieChart) { pieChart.destroy(); pieChart = null; }
        if (barChart) { barChart.destroy(); barChart = null; }
        return;
      }

      const labels = activeCats.map(c => c.label);
      const colors = activeCats.map(c => c.color);
      const spentData = activeCats.map(c => spent[c.id] || 0);
      const budgetData = activeCats.map(c => budget[c.id] || 0);

      const chartDefaults = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { labels: { font: { family: 'Segoe UI, system-ui, sans-serif' }, boxWidth: 12, padding: 16 } }
        }
      };

      if (pieChart) pieChart.destroy();
      pieChart = new Chart(document.getElementById('pieChart'), {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{ data: spentData, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }]
        },
        options: {
          ...chartDefaults,
          cutout: '65%',
          plugins: {
            ...chartDefaults.plugins,
            legend: { position: 'bottom', labels: { ...chartDefaults.plugins.legend.labels, padding: 12 } }
          }
        }
      });

      if (barChart) barChart.destroy();
      barChart = new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'Prévu', data: budgetData, backgroundColor: colors.map(c => c + '40'), borderRadius: 6 },
            { label: 'Dépensé', data: spentData, backgroundColor: colors, borderRadius: 6 }
          ]
        },
        options: {
          ...chartDefaults,
          scales: {
            y: {
              beginAtZero: true,
              grid: { color: '#e8eaef' },
              ticks: { callback: v => v + ' €', font: { size: 11 } }
            },
            x: { grid: { display: false }, ticks: { font: { size: 11 } } }
          },
          plugins: {
            ...chartDefaults.plugins,
            legend: { position: 'bottom' }
          }
        }
      });
    }

    function render() {
      document.getElementById('currentMonth').textContent = formatMonth(currentDate);
      renderSummary();
      renderBudgetBars();
      renderExpenseList();
      renderBudgetForm();
      renderCharts();
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // --- Actions ---

    function deleteExpense(id) {
      state.expenses = state.expenses.filter(e => e.id !== id);
      saveState();
      render();
      showToast('Dépense supprimée');
    }
    window.deleteExpense = deleteExpense;

    document.getElementById('expenseForm').addEventListener('submit', e => {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('amount').value);
      const date = document.getElementById('date').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value.trim();

      if (!amount || !description) return;

      state.expenses.push({
        id: crypto.randomUUID(),
        amount,
        date,
        category,
        description
      });
      saveState();
      e.target.reset();
      document.getElementById('date').value = new Date().toISOString().slice(0, 10);
      render();
      showToast('Dépense ajoutée');
    });

    document.getElementById('saveBudget').addEventListener('click', () => {
      const key = monthKey(currentDate);
      const budget = {};
      document.querySelectorAll('#budgetForm input').forEach(input => {
        const val = parseFloat(input.value);
        if (val > 0) budget[input.dataset.cat] = val;
      });
      state.budgets[key] = budget;
      saveState();
      render();
      showToast('Budget enregistré');
    });

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      render();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      render();
    });

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        if (tab.dataset.tab === 'dashboard') renderCharts();
      });
    });

    // Init
    const catSelect = document.getElementById('category');
    catSelect.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
    document.getElementById('date').value = new Date().toISOString().slice(0, 10);
    render();
  </script>
</body>
</html>
